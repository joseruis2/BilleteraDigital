spring.application.name=eureka_server
server.port=8761

# Este servidor NO se registra a si mismo como cliente ni intenta
# obtener el registro de otro Eureka: es el propio servidor.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Opcional: desactiva la auto-preservacion en desarrollo para que las
# instancias caidas desaparezcan del dashboard mas rapido (en prod se
# deja en true, protege contra falsos positivos por particiones de red).
eureka.server.enable-self-preservation=false