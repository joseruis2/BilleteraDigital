server.port=8083

spring.application.name=ms-cuentas

# ===== R2DBC (MySQL) =====
spring.r2dbc.url=r2dbc:mysql://localhost:3306/ms_cuentas_db
spring.r2dbc.username=root
spring.r2dbc.password=123456
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# ===== Flyway =====
spring.flyway.url=jdbc:mysql://localhost:3306/ms_cuentas_db
spring.flyway.user=root
spring.flyway.password=123456
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-cuentas-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Logging =====
logging.level.com.banco.ms_cuentas=DEBUG

# ===== Seguridad: valida JWT emitido por ms-auth (para endpoints cara al cliente) =====
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/.well-known/jwks.json

# ===== Seguridad interna: solo ms-pagos puede llamar a /api/cuentas/** internos =====
internal.api-key=${INTERNAL_API_KEY:cambia-esto-por-un-secreto-largo-y-aleatorio}