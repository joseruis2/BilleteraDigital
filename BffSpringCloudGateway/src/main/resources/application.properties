server.port=8080

spring.application.name=BffSpringCloudGateway

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5

# ===== LoadBalancer =====
spring.cloud.loadbalancer.cache.enabled=false

# ===== Rutas =====
spring.cloud.gateway.server.webflux.routes[0].id=ms_cliente
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-cliente
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**

spring.cloud.gateway.server.webflux.routes[1].id=ms_auth
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-auth
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**,/.well-known/**

spring.cloud.gateway.server.webflux.routes[2].id=ms_pagos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-pagos
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transferencias/**,/api/limites/**

spring.cloud.gateway.server.webflux.routes[3].id=ms_cuentas_mias
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-cuentas
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cuentas/mias

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ===== Logging =====
logging.level.org.springframework.cloud.gateway=DEBUG