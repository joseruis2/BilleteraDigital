server.port=8081

spring.application.name=ms-cliente

# ===== R2DBC (MySQL) =====
spring.r2dbc.url=r2dbc:mysql://localhost:3306/ms_cliente_db
spring.r2dbc.username=root
spring.r2dbc.password=123456
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# ===== Flyway (usa JDBC, no R2DBC) =====
spring.flyway.url=jdbc:mysql://localhost:3306/ms_cliente_db
spring.flyway.user=root
spring.flyway.password=123456
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# ===== Seguridad: valida JWT emitido por ms-auth =====
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/.well-known/jwks.json

# ===== Seguridad interna: solo ms-pagos puede llamar a /api/clientes/{id} =====
internal.api-key=${INTERNAL_API_KEY:cambia-esto-por-un-secreto-largo-y-aleatorio}

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Logging =====
logging.level.com.mibilletera.cliente=DEBUG
logging.level.org.springframework.r2dbc=INFO

# ===== OpenAPI / Swagger =====
springdoc.api-docs.path=/v3/api-docs